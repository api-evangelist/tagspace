aid: tagspace
name: tagSpace
description: >-
  tagSpace is a Spatial AI platform, part of the tagStorm group, that lets
  creators and brands publish interactive augmented-reality experiences and
  spatial content anchored to real-world places. Through its create, explore,
  and publish surfaces, tagSpace offers a creator-economy platform where makers
  showcase spatial "tags," and its tagAI layer applies AI to spatial content.
  It markets to brands and enterprises (B2B) with named partners including RTL,
  Telekom, Telstra, Warner Music Group and others. The public site is a Framer
  marketing presence; as of this enrichment pass tagSpace exposes no public
  developer portal, API documentation, OpenAPI specification, SDK, or
  well-known API metadata. This profile remains an identity-only company record.
